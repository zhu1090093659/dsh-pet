name: Release

# Release pipeline. Pushing a vX.Y.Z tag is the single release switch, and the
# tag is the version source of truth - the job refuses to publish when
# package.json disagrees with it. Publishing needs the repository secret
# NPM_TOKEN (an npm automation token for the @linxin666 scope).
#
# The workflow can also be dispatched with an existing tag. That lane exists
# because npm publish itself succeeds before the registry finishes serving the
# new version (npm answers "your package is being processed"), and a release
# that failed only its propagation check must be completable without moving or
# re-pushing the tag: the publish step is idempotent, so a dispatched run skips
# it and finishes with the registry assertion and the GitHub Release.
#
# A tag push does not run ci.yml (that fires on branch pushes and pull
# requests), so the same gates run again here: the tag is validated on its own
# before anything reaches npm.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)process (vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Gate, publish and release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Script tests
        run: node --test scripts/dsh-pet-migrate-v2.test.mjs scripts/dsh-pet.test.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Resolve the release tag
        id: release
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${{ github.ref_name }}"
          else
            tag="${{ github.event.inputs.tag }}"
          fi
          case "$tag" in
            v*) ;;
            *) echo "tag must look like vX.Y.Z, got: $tag" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "releasing $tag"

      - name: Verify the package version matches the tag
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -eu
          actual=$(node -p "require('./package.json').version")
          if [ "$actual" != "$VERSION" ]; then
            echo "package.json says $actual but the tag says $VERSION" >&2
            exit 1
          fi
          echo "package version $actual matches the tag"

      - name: Stage the release notes
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -eu
          notes="docs/release-notes/$TAG.md"
          if [ ! -f "$notes" ]; then
            echo "missing $notes" >&2
            exit 1
          fi
          cp "$notes" "$RUNNER_TEMP/release-notes.md"

      # Idempotent on purpose: a dispatched run for a tag that already
      # published must not die here, because npm rejects a version that
      # already exists.
      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -eu
          name=$(node -p "require('./package.json').name")
          if npm view "$name@$VERSION" version >/dev/null 2>&1; then
            echo "$name@$VERSION is already on the registry; skipping the publish step"
            exit 0
          fi
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc
          npm publish --access public --tag latest --registry=https://registry.npmjs.org/

      # A publish success line is not a trust boundary. npm accepts the upload
      # and then serves it only once its own processing finishes; that lag was
      # measured in minutes here (pet 0.3.25 took about eight), so the budget
      # is deliberately longer than any observed delay before the Release is
      # cut. A tag that fails only this step is completable from the dispatch
      # lane without re-publishing.
      - name: Verify the published version resolves
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -eu
          name=$(node -p "require('./package.json').name")
          for i in $(seq 1 40); do
            if [ "$(npm view "$name@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "$name@$VERSION resolves from the registry"
              exit 0
            fi
            echo "waiting for registry propagation ($i/40)"
            sleep 15
          done
          echo "$name@$VERSION did not appear on the registry" >&2
          exit 1

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
            echo "updated the existing Release $TAG"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
            echo "created Release $TAG"
          fi
