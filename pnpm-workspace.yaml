# Upstream packaging defect: published SDK packages import runtime dependencies
# their manifests never declare, so a standalone install cannot resolve them.
# Restored at the versions the official source pins; the monorepo carries the
# same workaround in its root pnpm-workspace.yaml.
autoInstallPeers: false

overrides:
  '@deepseek-ai/dsh-client-store': '0.2.3-alpha.2'
  '@deepseek-ai/dsh-client-ui-primitives': '0.2.3-alpha.2'
  '@deepseek-ai/dsh-client-ui-slots': '0.2.3-alpha.2'

packageExtensions:
  '@deepseek-ai/dsh-client-store@0.2.3-alpha.2':
    dependencies:
      zustand: '~4.5.7'
      immer: '^10.1.1'
  '@deepseek-ai/dsh-client-ui-primitives@0.2.3-alpha.2':
    dependencies:
      anser: '^2.3.5'
      clsx: '^2.0.0'
      diff: '^9.0.0'
      katex: '^0.18.7'
      shiki: '^4.4.3'
      '@shikijs/langs': '^4.4.3'
      mdast-util-from-markdown: '^2.1.0'
      mdast-util-gfm: '^3.1.0'
      mdast-util-math: '^3.0.0'
      micromark-core-commonmark: '^2.0.3'
      micromark-extension-gfm: '^3.0.0'
      micromark-extension-math: '^3.1.0'
      micromark-factory-space: '^2.0.1'
      micromark-util-character: '^2.1.1'
      micromark-util-classify-character: '^2.0.1'
      micromark-util-decode-string: '^2.0.1'
      micromark-util-sanitize-uri: '^2.0.1'
      micromark-util-symbol: '^2.0.1'
      micromark-util-types: '^2.0.2'
      '@deepseek-ai/dsh-util-workspace-path': '0.2.3-alpha.2'
      '@deepseek-ai/dsh-util-code-language': '0.2.3-alpha.2'
      '@deepseek-ai/dsh-util-file-drag': '0.2.3-alpha.2'
      simple-icons: '16.31.0'

