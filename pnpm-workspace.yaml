# Upstream packaging defect: published SDK packages import runtime dependencies
# their manifests never declare, so a standalone install cannot resolve them.
# Restored at the versions the official source pins; the monorepo carries the
# same workaround in its root pnpm-workspace.yaml. Re-verified against the
# 0.2.2-rc.1 tarballs: both packages still declare no runtime dependencies.
autoInstallPeers: false
packageExtensions:
  '@deepseek-ai/dsh-client-store@0.2.2-rc.1':
    dependencies:
      zustand: '~4.4.7'
      immer: '^10.1.1'
  '@deepseek-ai/dsh-client-ui-primitives@0.2.2-rc.1':
    dependencies:
      anser: '^2.3.5'
      clsx: '^2.0.0'
      diff: '^9.0.0'
      katex: '^0.16.47'
      shiki: '^4.3.1'
      '@shikijs/langs': '^4.3.1'
      mdast-util-from-markdown: '^2.0.3'
      mdast-util-gfm: '^3.1.0'
      mdast-util-math: '^3.0.0'
      micromark-core-commonmark: '^2.0.3'
      micromark-extension-gfm: '^3.0.0'
      micromark-extension-math: '^3.1.0'
      micromark-factory-space: '^2.0.1'
      micromark-util-character: '^2.1.1'
      micromark-util-classify-character: '^2.0.1'
      micromark-util-sanitize-uri: '^2.0.1'
      micromark-util-symbol: '^2.0.1'
      '@deepseek-ai/dsh-util-workspace-path': '0.2.2-rc.1'
      '@deepseek-ai/dsh-util-code-language': '0.2.2-rc.1'
      simple-icons: '16.31.0'

minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis@4.1.0'
  - '@deepseek-ai/cordis-plugin-loader@1.1.0'
  - '@deepseek-ai/cosmokit@1.9.0'
  - '@deepseek-ai/dsh-agent@0.2.2-rc.1'
  - '@deepseek-ai/dsh-api-remotes@0.2.2-rc.1'
  - '@deepseek-ai/dsh-api-session-controller@0.2.2-rc.1'
  - '@deepseek-ai/dsh-api-workspace-controller@0.2.2-rc.1'
  - '@deepseek-ai/dsh-atomic-write@0.2.2-rc.1'
  - '@deepseek-ai/dsh-brand@0.2.2-rc.1'
  - '@deepseek-ai/dsh-chunked-list@0.2.2-rc.1'
  - '@deepseek-ai/dsh-client-locale@0.2.2-rc.1'
  - '@deepseek-ai/dsh-client-store@0.2.2-rc.1'
  - '@deepseek-ai/dsh-client-ui-conversation@0.2.2-rc.1'
  - '@deepseek-ai/dsh-client-ui-renderer@0.2.2-rc.1'
  - '@deepseek-ai/dsh-client-ui-settings@0.2.2-rc.1'
  - '@deepseek-ai/dsh-client-ui-slots@0.2.2-rc.1'
  - '@deepseek-ai/dsh-client-ui-workspace@0.2.2-rc.1'
  - '@deepseek-ai/dsh-config-editor@0.2.2-rc.1'
  - '@deepseek-ai/dsh-deque@0.2.2-rc.1'
  - '@deepseek-ai/dsh-host-webserver@0.2.2-rc.1'
